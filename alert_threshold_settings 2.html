<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert threshold settings</title>
<style>
  :root {
    --border: #d3d1c7;
    --border-strong: #b4b2a9;
    --text-primary: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-danger: #A32D2D;
    --bg-danger: #FCEBEB;
    --border-danger: #E24B4A;
    --surface-1: #F1EFE8;
    --surface-2: #ffffff;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    background: var(--surface-1);
    margin: 0;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
  }
  form {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.75rem;
    max-width: 480px;
    width: 100%;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 0.25rem;
  }
  p.subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 1.5rem;
  }
  .field {
    margin-bottom: 1.1rem;
  }
  .field label,
  fieldset legend {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  select, input[type="number"] {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 14px;
    background: #fff;
    color: var(--text-primary);
  }
  select:disabled, input:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  [aria-invalid="true"] {
    border-color: var(--border-danger);
    border-width: 1px;
  }
  .field-error {
    font-size: 13px;
    color: var(--text-danger);
    margin-top: 4px;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .toggle-row label {
    margin-bottom: 0;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    position: absolute;
    z-index: 1;
  }
  .switch .track {
    position: absolute;
    inset: 0;
    background: var(--border-strong);
    border-radius: 999px;
    transition: background 0.15s;
  }
  .switch .thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: left 0.15s;
  }
  .switch input:checked + .track {
    background: #3C3489;
  }
  .switch input:checked ~ .thumb {
    left: 20px;
  }
  fieldset {
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin: 0;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    padding: 4px 0;
  }
  .checkbox-row input {
    width: 16px;
    height: 16px;
  }
  .checkbox-row label {
    margin-bottom: 0;
    font-weight: 400;
  }
  #form-summary-error {
    font-size: 13px;
    color: var(--text-danger);
    background: var(--bg-danger);
    border: 0.5px solid var(--border-danger);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 1rem;
  }
  #form-summary-error:empty {
    display: none;
  }
  #form-summary-error ul {
    margin: 4px 0 0;
    padding-left: 18px;
  }
  #form-success {
    font-size: 13px;
    color: #085041;
    background: #E1F5EE;
    border: 0.5px solid #1D9E75;
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 1rem;
  }
  #form-success:empty {
    display: none;
  }
  button {
    width: 100%;
    height: 38px;
    background: #2c2c2a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  button:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>

<form id="alert-threshold-form" novalidate>
  <h1>Alert threshold settings</h1>
  <p class="subtitle">Configure when this alert should trigger and how you're notified.</p>

  <!-- Aggregate, screen-reader announced error summary -->
  <div id="form-summary-error" role="alert" aria-live="assertive"></div>
  <div id="form-success" role="status" aria-live="polite"></div>

  <div class="field">
    <label for="alertType">Alert type</label>
    <select id="alertType" name="alertType">
      <option value="amount">Transaction amount</option>
      <option value="volume">Daily volume</option>
      <option value="postings">Failed postings</option>
    </select>
  </div>

  <div class="field toggle-row">
    <label for="enabled">Enabled</label>
    <span class="switch">
      <input type="checkbox" id="enabled" name="enabled" checked>
      <span class="track" aria-hidden="true"></span>
      <span class="thumb" aria-hidden="true"></span>
    </span>
  </div>

  <div class="field">
    <label for="threshold">Threshold value</label>
    <input type="number" id="threshold" name="threshold" min="0" step="any"
           aria-describedby="threshold-error" aria-invalid="false">
    <div id="threshold-error" class="field-error" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="operator">Comparison operator</label>
    <select id="operator" name="operator" aria-describedby="operator-error" aria-invalid="false">
      <option value="">Select an operator</option>
      <option value="above">Above</option>
      <option value="below">Below</option>
    </select>
    <div id="operator-error" class="field-error" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="unit">Unit</label>
    <select id="unit" name="unit" aria-describedby="unit-error" aria-invalid="false">
      <option value="">Select a unit</option>
    </select>
    <div id="unit-error" class="field-error" aria-live="polite"></div>
  </div>

  <div class="field">
    <fieldset aria-describedby="notify-error">
      <legend>Notify via</legend>
      <div class="checkbox-row">
        <input type="checkbox" id="notifyEmail" name="notifyVia" value="email">
        <label for="notifyEmail">Email</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="notifyDashboard" name="notifyVia" value="dashboard">
        <label for="notifyDashboard">Dashboard badge</label>
      </div>
    </fieldset>
    <div id="notify-error" class="field-error" aria-live="polite"></div>
  </div>

  <button type="submit">Save alert</button>
</form>

<script>
(function () {
  var UNIT_OPTIONS = {
    amount: [
      { value: "ngn", label: "NGN (currency)" },
      { value: "usd", label: "USD (currency)" }
    ],
    volume: [
      { value: "percent", label: "% (percent)" }
    ],
    postings: [
      { value: "count", label: "count" }
    ]
  };

  var form = document.getElementById("alert-threshold-form");
  var alertTypeEl = document.getElementById("alertType");
  var enabledEl = document.getElementById("enabled");
  var thresholdEl = document.getElementById("threshold");
  var operatorEl = document.getElementById("operator");
  var unitEl = document.getElementById("unit");
  var notifyEmailEl = document.getElementById("notifyEmail");
  var notifyDashboardEl = document.getElementById("notifyDashboard");
  var summaryError = document.getElementById("form-summary-error");
  var successEl = document.getElementById("form-success");

  function populateUnits() {
    var options = UNIT_OPTIONS[alertTypeEl.value] || [];
    var current = unitEl.value;
    unitEl.innerHTML = "";
    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select a unit";
    unitEl.appendChild(placeholder);
    options.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      unitEl.appendChild(o);
    });
    if (options.some(function (o) { return o.value === current; })) {
      unitEl.value = current;
    }
  }

  function setDependentFieldsDisabled(disabled) {
    thresholdEl.disabled = disabled;
    operatorEl.disabled = disabled;
    unitEl.disabled = disabled;
    notifyEmailEl.disabled = disabled;
    notifyDashboardEl.disabled = disabled;
  }

  function clearFieldError(inputEl, errorEl) {
    inputEl.setAttribute("aria-invalid", "false");
    errorEl.textContent = "";
  }

  function setFieldError(inputEl, errorEl, message) {
    inputEl.setAttribute("aria-invalid", "true");
    errorEl.textContent = message;
  }

  function clearAllErrors() {
    clearFieldError(thresholdEl, document.getElementById("threshold-error"));
    clearFieldError(operatorEl, document.getElementById("operator-error"));
    clearFieldError(unitEl, document.getElementById("unit-error"));
    document.getElementById("notify-error").textContent = "";
    summaryError.innerHTML = "";
    successEl.textContent = "";
  }

  function validate() {
    clearAllErrors();
    var errors = [];

    if (!enabledEl.checked) {
      // Disabled: only alert type + enabled matter. Both always have values.
      return errors;
    }

    var thresholdRaw = thresholdEl.value;
    var thresholdNum = parseFloat(thresholdRaw);
    if (thresholdRaw === "" || isNaN(thresholdNum)) {
      setFieldError(thresholdEl, document.getElementById("threshold-error"), "Enter a threshold value.");
      errors.push("Threshold value is required.");
    } else if (thresholdNum < 0) {
      setFieldError(thresholdEl, document.getElementById("threshold-error"), "Threshold can't be negative.");
      errors.push("Threshold value can't be negative.");
    }

    if (!operatorEl.value) {
      setFieldError(operatorEl, document.getElementById("operator-error"), "Choose a comparison operator.");
      errors.push("Comparison operator is required.");
    }

    if (!unitEl.value) {
      setFieldError(unitEl, document.getElementById("unit-error"), "Choose a unit.");
      errors.push("Unit is required.");
    }

    if (!notifyEmailEl.checked && !notifyDashboardEl.checked) {
      document.getElementById("notify-error").textContent = "Select at least one notification method.";
      errors.push("At least one notification method is required.");
    }

    return errors;
  }

  function renderSummary(errors) {
    if (errors.length === 0) {
      summaryError.innerHTML = "";
      return;
    }
    var html = "<strong>" + errors.length + " error" + (errors.length > 1 ? "s" : "") + " found:</strong><ul>";
    errors.forEach(function (e) {
      html += "<li>" + e + "</li>";
    });
    html += "</ul>";
    summaryError.innerHTML = html;
  }

  alertTypeEl.addEventListener("change", populateUnits);

  enabledEl.addEventListener("change", function () {
    setDependentFieldsDisabled(!enabledEl.checked);
    clearAllErrors();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var errors = validate();
    renderSummary(errors);
    if (errors.length === 0) {
      successEl.textContent = "Alert threshold saved.";
    }
  });

  // init
  populateUnits();
  setDependentFieldsDisabled(!enabledEl.checked);
})();
</script>
</body>
</html>
