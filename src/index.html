<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive AI Converter</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Responsive AI Converter</h1>
            <p class="tagline">AI-Powered Responsive Design Optimization</p>
        </header>

        <main class="main-content">
            <section style="grid-column: 1 / -1; padding: 20px; border: 1px solid #ccc; margin-bottom: 20px;">
                <h2>Settings</h2>
                <form id="settingsForm">
                    <p>Name: <input type="text" id="name"></p>
                    <p>Email: <input type="email" id="email"></p>
                    <p>CPU Alert %: <input type="number" id="cpu" value="80"></p>
                    <p>Memory Alert %: <input type="number" id="memory" value="75"></p>
                    <p>Notify: 
                        <select id="notify">
                            <option>Email</option>
                            <option>SMS</option>
                        </select>
                    </p>
                    <p><input type="checkbox" id="alerts"> Enable alerts</p>
                    <button type="button" onclick="saveSettings()">Save</button>
                </form>
                <p id="msg"></p>
            </section>

            <section class="input-section">
                <h2>Analyze Your Design</h2>
                <textarea 
                    id="input" 
                    class="input-textarea"
                    placeholder="Paste your HTML or describe your design challenge..."
                    rows="8"
                ></textarea>
                <button id="analyzeBtn" class="btn btn--primary">Analyze with AI</button>
            </section>

            <section class="output-section">
                <h2>AI Recommendations</h2>
                <div id="output" class="output-box">
                    <p class="placeholder">Analysis results will appear here...</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Responsive AI Converter. MIT License.</p>
        </footer>
    </div>

    <script src="scripts/app.js"></script>
    <script>
        function saveSettings() {
            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var msg = document.getElementById('msg');
            if (!name || !email) {
                msg.innerHTML = '<span style="color:red">Please fill in all fields</span>';
                return;
            }
            if (email.indexOf('@') === -1) {
                msg.innerHTML = '<span style="color:red">Invalid email</span>';
                return;
            }
            msg.innerHTML = '<span style="color:green">Settings saved!</span>';
        }
    </script>
</body>
</html>
